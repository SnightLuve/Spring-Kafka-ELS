services:
  product-service:
    build:
      context: ./product-service
    container_name: els-product-service
    environment:
      SQLSERVER_URL: jdbc:sqlserver://sqlserver:1433;databaseName=db;encrypt=true;trustServerCertificate=true
      SQLSERVER_USERNAME: sa
      SQLSERVER_PASSWORD: YourPassword@123
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PRODUCT_SYNC_TOPIC: product-sync-topic
      ELASTIC_APM_SERVICE_NAME: product-service
      ELASTIC_APM_SERVER_URLS: http://apm-server:8200
      ELASTIC_APM_ENVIRONMENT: docker
      ELASTIC_APM_TRANSACTION_SAMPLE_RATE: "1.0"
    ports:
      - "18082:8082"
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      apm-server:
        condition: service_started
    networks:
      - els-network

  search-service:
    build:
      context: ./search-service
    container_name: els-search-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PRODUCT_SYNC_GROUP_ID: search-service-product-sync-group
      PRODUCT_SYNC_TOPIC: product-sync-topic
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: YourPassword@123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELASTIC_APM_SERVICE_NAME: search-service
      ELASTIC_APM_SERVER_URLS: http://apm-server:8200
      ELASTIC_APM_ENVIRONMENT: docker
      ELASTIC_APM_TRANSACTION_SAMPLE_RATE: "1.0"
    ports:
      - "18083:8083"
    depends_on:
      - kafka
      - elasticsearch
      - redis
      - apm-server
    networks:
      - els-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: els-sqlserver-ms
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourPassword@123"
    ports:
      - "11433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - els-network

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: els-sqlserver-init-ms
    command: >
      bash -c '
        echo "Waiting for SQL Server...";
        until /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "YourPassword@123" -C -Q "SELECT 1" > /dev/null 2>&1; do sleep 5; done;
        echo "Creating database db if missing...";
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "YourPassword@123" -C -Q "IF DB_ID(NCHAR(100)+NCHAR(98)) IS NULL CREATE DATABASE [db];";
        echo "SQL Server setup complete.";
      '
    depends_on:
      - sqlserver
    networks:
      - els-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    container_name: els-elasticsearch-ms
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.authc.api_key.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: "YourPassword@123"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "19200:9200"
      - "19300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - els-network

  kibana:
    image: docker.elastic.co/kibana/kibana:9.0.0
    container_name: els-kibana-ms
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      ELASTICSEARCH_USERNAME: "kibana_system"
      ELASTICSEARCH_PASSWORD: "YourPassword@123"
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: "els_microservices_dev_key_32_chars"
      XPACK_FLEET_AGENTS_ENABLED: "true"
      XPACK_FLEET_ISAIRGAPPED: "true"
      XPACK_FLEET_AGENTS_ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      XPACK_FLEET_AGENTS_FLEET_SERVER_HOSTS: '["http://localhost:18220"]'
    ports:
      - "15601:5601"
    depends_on:
      - setup
    networks:
      - els-network

  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    container_name: els-setup-ms
    user: "0"
    command: >
      bash -c '
        echo "Waiting for Elasticsearch...";
        until curl -s -u "elastic:YourPassword@123" -o /dev/null -w "%{http_code}" "http://elasticsearch:9200/_cluster/health" | grep -q "200"; do sleep 5; done;
        echo "Setting kibana_system password...";
        until curl -s -u "elastic:YourPassword@123" -X POST "http://elasticsearch:9200/_security/user/kibana_system/_password" -H "Content-Type: application/json" -d "{\"password\":\"YourPassword@123\"}" | grep -q "^{}"; do sleep 5; done;
        echo "Elastic setup complete.";
      '
    depends_on:
      - elasticsearch
    networks:
      - els-network

  apm-server:
    image: docker.elastic.co/apm/apm-server:9.0.0
    container_name: els-apm-server-ms
    command:
      - -e
      - -E
      - apm-server.host=0.0.0.0:8200
      - -E
      - output.elasticsearch.hosts=["http://elasticsearch:9200"]
      - -E
      - output.elasticsearch.username=elastic
      - -E
      - output.elasticsearch.password=YourPassword@123
      - -E
      - apm-server.kibana.enabled=true
      - -E
      - apm-server.kibana.host=http://kibana:5601
      - -E
      - apm-server.kibana.username=elastic
      - -E
      - apm-server.kibana.password=YourPassword@123
      - -E
      - apm-server.auth.anonymous.enabled=true
    ports:
      - "18200:8200"
    depends_on:
      - elasticsearch
      - kibana
    networks:
      - els-network

  kafka:
    image: apache/kafka:3.9.0
    container_name: els-kafka-ms
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "19092:9092"
    networks:
      - els-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: els-kafka-ui-ms
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: els-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "18090:8080"
    networks:
      - els-network

  redis:
    image: redis:7.2-alpine
    container_name: els-redis-ms
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - els-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: els-redis-commander-ms
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "18081:8081"
    depends_on:
      - redis
    networks:
      - els-network

volumes:
  sqlserver-data:
  elasticsearch-data:
  redis-data:

networks:
  els-network:
    driver: bridge
